version: "3.9"

services:
  openproject-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: openproject-mcp:latest
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import sys, urllib.request;
          resp = urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=5);
          sys.exit(0 if resp.status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
