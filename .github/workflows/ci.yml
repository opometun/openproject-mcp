name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,http]"
          
      - name: Run Linting (Ruff)
        run: |
          ruff check .
          ruff format --check .
          
      - name: Run Tests
        run: |
          pytest

  test-base-install:
    name: "Verify base install CLI entrypoints"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install base only (no http extra)
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: CLI help works without http extra
        run: |
          openproject-mcp --help
          openproject-mcp stdio --help

      - name: HTTP subcommand help works from base install
        run: |
          openproject-mcp http --help
